[package]
name = "toolbox-core"
version = "1.3.0"
license = "Apache-2.0"
description = "SSH Toolbox backend logic. Must not depend on Tauri."
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1.9"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "io-util", "net"] }
tokio-util = "0.7"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
directories = "6.0.0"
toml = "0.9"
url = "2"
keyring-core = "1.0.1"
russh-sftp = "3.0.1"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
bytes = "1"
rand = { version = "0.10", features = ["thread_rng"] }
base64 = "0.22"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
x509-parser = "0.18.1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
tokio-serial = "5.5.0"
bollard = "0.21.1"
futures-util = "0.3"
serde_json = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
tower-service = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util", "process"] }
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
tempfile = "3"
rcgen = "0.14.10"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
