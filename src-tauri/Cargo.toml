[package]
name = "app"
version = "1.3.0"
license = "Apache-2.0"
description = "SSH Toolbox"
authors = ["SSH Toolbox"]
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
toolbox-core = { path = "../crates/core" }
tokio = { version = "1", features = ["rt"] }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "=2.8.4"
tokio-util = "0.7"
directories = "6"
uuid = { version = "1", features = ["v4"] }
